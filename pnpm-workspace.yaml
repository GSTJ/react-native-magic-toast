packages:
  - example

# React Native's Metro bundler resolves modules by walking up node_modules
# directories, so the isolated store layout breaks it. Same setting as
# react-native-magic-modal.
nodeLinker: hoisted
dedupeDirectDeps: true

# Carried over from the `resolutions` fields that yarn used in the root and in
# `example/`.
overrides:
  "@types/react": "~19.2.14"
  "uuid": "^11.1.1"
  # GHSA-rgw5-rvv9-x895. Both brace-expansion branches in the tree need their
  # bounded expansion fix. The 5.0.8 fix for the earlier advisory was incomplete.
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@>=4.0.0 <5.0.9": "^5.0.9"
  # GHSA-7p8r-x3mc-p8w7. commitlint reaches fast-uri through ajv.
  "fast-uri@>=3.0.0 <3.1.5": "^3.1.5"
