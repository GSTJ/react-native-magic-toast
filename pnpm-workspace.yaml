packages:
  - example

auditConfig:
  # pnpm audits published versions, so it cannot see the local patch below.
  # The timeout regression check is the control for both parser advisories.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

# Keep newly published packages out of installs for 14 days. pnpm applies this
# to direct and transitive dependencies, including frozen-lockfile installs.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Security fixes for Dependabot #240, #242 and #244-#246, plus npm audit.
  # Required transitive dependencies of the glob/minimatch security update.
  - "@isaacs/nonrecursive-glob-match@1.0.1"
  - path-scurry@3.0.0
  - basic-ftp@6.2.1
  - zod@4.6.6
  - glob@14.0.2
  - minimatch@11.0.1
  - fast-uri@3.1.9
  - undici@7.30.1
  - ip-address@10.7.4
  - node-forge@1.4.1
  # Security fix, a few hours short of the 14-day window.
  - source-map-js@1.2.2
  # GSTJ owns the source and publish path for the magic-* packages, so they can
  # move immediately with the matching Renovate rule.
  - "magic-*"
  # These exact third-party versions were already present on main on
  # 2026-08-04, before the floor existed. The exclusions keep that lockfile
  # installable without exempting later releases.
  - "@react-native/babel-plugin-codegen@0.86.1"
  - "@react-native/babel-preset@0.86.1"
  - "@react-native/codegen@0.86.1"
  - "@react-native/js-polyfills@0.86.1"
  - "@react-native/metro-babel-transformer@0.86.1"
  - "@react-native/metro-config@0.86.1"
  - "@release-it/conventional-changelog@12.0.0"
  - "baseline-browser-mapping@2.11.3"
  - "electron-to-chromium@1.5.396"
  - "es-toolkit@1.50.0"
  - "eslint-plugin-safe-jsx@1.3.5"
  - "fs-extra@11.4.0"
  - "giget@3.3.1"
  - "nanoid@3.3.18"
  - "postcss@8.5.23"
  - "release-it@21.0.0"
  - "sax@1.6.1"
  - "yargs@18.1.0"

patchedDependencies:
  # image-size is archived and has no published fix for its zero-length entry
  # loops, so Metro uses this narrow parser patch until it replaces the package.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch

# React Native's Metro bundler resolves modules by walking up node_modules
# directories, so the isolated store layout breaks it. Same setting as
# react-native-magic-modal.
nodeLinker: hoisted
dedupeDirectDeps: true

# Carried over from the `resolutions` fields that yarn used in the root and in
# `example/`.
overrides:
  # Major tooling updates, covered by dependency-security-check.cjs.
  "basic-ftp@<6.2.1": "6.2.1"
  "zod@<4.6.6": "4.6.6"
  "glob@>=9 <14.0.2": "14.0.2"
  "minimatch@>=9 <11.0.1": "11.0.1"
  # npm audit: Expo certificate tooling.
  "node-forge@<1.4.1": "^1.4.1"
  # Dependabot: source-map-js <1.2.2, compression <1.8.2, tinypool <2.1.2 (dev-only tooling).
  source-map-js@<1.2.2: ^1.2.2
  compression@<1.8.2: ^1.8.2
  tinypool@<2.1.2: ^2.1.2
  # GHSA (Dependabot): shell-quote >=1.8.4 <1.11.0 is vulnerable. react-devtools-core
  # (dev-only, via react-native) pulls it in.
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  "@types/react": "~19.2.14"
  "uuid": "^11.1.1"
  # GHSA-6gmq-8vp8-gcm6. Expo's plist tooling reaches both maintained xmldom lines.
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "^0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "^0.9.12"
  # GHSA-rgw5-rvv9-x895. Both brace-expansion branches in the tree need their
  # bounded expansion fix (bumped again for Dependabot #229 and #230). The 5.0.8 fix for the earlier advisory was incomplete.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp, plus the 3.1.6 advisory (Dependabot #213).
  # Dependabot #240, #244-#246 require 3.1.9.
  # commitlint reaches fast-uri through ajv.
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  # Dependabot #215 and GHSA-rxp7-6hxx-x8q5. release-it reaches ip-address through socks.
  "ip-address@>=10.0.0 <10.7.4": "^10.7.4"
  # GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh. Jest and Expo reach both
  # maintained js-yaml lines.
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  # Dependabot #217-#224 and #242. release-it reaches undici through its GitHub client.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  # GHSA-2v37-7h3g-55p8. Expo reaches nanoid through PostCSS.
  "nanoid@3": "^3.3.18"
